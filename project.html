<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting… — Jarne Beaufays</title>
  <meta name="robots" content="noindex" />
  <script>
    /* Projects now open in an overlay on the home page instead of a
       separate page — send old project.html?slug=… links there. */
    (function () {
      var slug = new URLSearchParams(location.search).get("slug");
      location.replace(slug ? "./?project=" + encodeURIComponent(slug) : "./");
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./" />
</head>

<body>
  <p>Redirecting to <a href="./">the project</a>…</p>
</body>

</html>
